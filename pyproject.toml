[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Niklas Rosenstein", email = "rosensteinniklas@gmail.com"},
]
license = {text = "MIT"}
requires-python = "<4.0,>=3.8"
dependencies = [
    "cryptography<43.0.0,>=42.0.5",
    "pygithub>=2.5.0",
    "PyJWT<3.0.0,>=2.6.0",
    "requests<3.0.0,>=2.28.2",
    "urllib3<2.0.0,>=1.26.15",
]
name = "github-bot-api"
version = "0.6.0"
description = "API for creating GitHub bots and webhooks in Python."
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = []

[project.urls]
"Bug Tracker" = "https://github.com/NiklasRosenstein/python-github-bot-api/issues"
Documentation = "https://niklasrosenstein.github.io/python-github-bot-api/"
Repository = "https://github.com/NiklasRosenstein/python-github-bot-api"

[tool.mypy]
python_version = "3.8"
explicit_package_bases = true
mypy_path = ["src"]
namespace_packages = true
pretty = true
show_error_codes = true
show_error_context = true
# strict = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.uv]
dev-dependencies = [
    "mypy",
    "pytest",
    "ruff>=0.8.5",
    "types-flask",
    "types-requests",
]
