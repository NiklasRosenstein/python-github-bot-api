name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "version=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $TAG_NAME"

      - name: Validate pyproject.toml version
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "Tag version: $VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Error: Version mismatch between tag ($VERSION) and pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "✓ pyproject.toml version matches tag"

      - name: Validate __init__.py version
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          INIT_VERSION=$(grep '^__version__ = ' src/github_bot_api/__init__.py | cut -d'"' -f2)
          echo "Tag version: $VERSION"
          echo "__init__.py version: $INIT_VERSION"
          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "Error: Version mismatch between tag ($VERSION) and __init__.py ($INIT_VERSION)"
            exit 1
          fi
          echo "✓ __init__.py version matches tag"

      - name: Validate changelog exists
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          CHANGELOG_FILE=".changelog/$VERSION.toml"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "Error: Changelog file $CHANGELOG_FILE does not exist"
            exit 1
          fi
          echo "✓ Changelog file exists: $CHANGELOG_FILE"

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tool
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify build artifacts
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          WHEEL="dist/github_bot_api-$VERSION-py3-none-any.whl"
          SDIST="dist/github_bot_api-$VERSION.tar.gz"

          if [ ! -f "$WHEEL" ]; then
            echo "Error: Wheel file not found: $WHEEL"
            exit 1
          fi
          echo "✓ Wheel built: $WHEEL"

          if [ ! -f "$SDIST" ]; then
            echo "Error: Source distribution not found: $SDIST"
            exit 1
          fi
          echo "✓ Source distribution built: $SDIST"

          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Generating changelog for version $VERSION"
          uvx --from slap-cli slap changelog format --markdown "$VERSION" > changelog.md
          cat changelog.md

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.validate.outputs.version }}
          body_path: changelog.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
